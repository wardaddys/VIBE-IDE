appId: com.vibe.ide
productName: VIBE IDE
directories:
  output: release/${version}
files:
  - dist
  - dist-electron
asar: true
# node-pty ships a native .node binary; it must live OUTSIDE the asar archive
# or the agent bash tool and the terminal silently fail in the packaged app.
asarUnpack:
  - "**/node_modules/node-pty/**"
nodeGypRebuild: false
npmRebuild: true
mac:
  target: dmg
  artifactName: ${name}-${version}-mac.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${name}-${version}-setup.${ext}
linux:
  target: AppImage
  artifactName: ${name}-${version}-linux.${ext}
